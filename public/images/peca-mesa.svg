<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9A05B"/>
      <stop offset="55%" stop-color="#C8853F"/>
      <stop offset="100%" stop-color="#9C6530"/>
    </linearGradient>
    <filter id="veio" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.5" numOctaves="4" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="linhas" width="800" height="18" patternUnits="userSpaceOnUse">
      <rect width="800" height="18" fill="none"/>
      <rect y="0" width="800" height="7" fill="#9C6530" opacity="0.22"/>
      <rect y="11" width="800" height="2" fill="#D9A05B" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#base)"/>
  <g filter="url(#veio)">
    <rect x="-40" y="-40" width="880" height="1080" fill="url(#linhas)"/>
  </g>
  <rect width="800" height="1000" fill="#9C6530" opacity="0.06"/>
</svg>
